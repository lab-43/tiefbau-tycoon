# Checks every push. The private models are not in the repo, so the game runs with its procedural
# fallback models here – enough for logic, UI flow, save/load and map parsing.
# Automerge: a branch whose newest commit contains "Automerge: ja" (written by tools/agent/merge.sh
# when a session may not push to main itself) is fast-forwarded into main after green tests.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      scenarios:
        description: "e2e-Szenarien (z. B. smoke issue job lowbed save+load pbf)"
        default: "smoke issue pbf job"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Regeln (lint)
        run: python3 tools/lint.py
      - name: Meldungswerkzeug (issues.py)
        run: bash tools/agent/test_issues.sh
      - name: Godot-Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.5.1-linux
      - name: Godot + Import
        run: bash tools/setup_env.sh --ci
      - name: Kompilieren
        run: bash tools/check.sh
      - name: e2e
        env:
          E2E_TIMEOUT: "1500"
        run: bash tools/test.sh ${{ github.event.inputs.scenarios || 'smoke issue pbf' }}
      - name: Logs bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/tt_*.log
          if-no-files-found: ignore

  automerge:
    needs: test
    # quoted: a plain YAML scalar must not contain ": " (the "Automerge: ja" text)
    if: "${{ github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, 'Automerge: ja') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # one merge at a time across all branches = a simple merge queue
    concurrency:
      group: automerge
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Godot-Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.5.1-linux
      - name: Godot + Import
        run: bash tools/setup_env.sh --ci
      - name: Nach main (rebase + Tests falls main weitergelaufen ist)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4; do
            git fetch -q origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "main ist weitergelaufen – rebase und erneut testen"
              git rebase -q origin/main || { git rebase --abort; echo "::error::Konflikt mit main – in der Session tools/agent/merge.sh ausführen (rebase lokal lösen)."; exit 1; }
              python3 tools/lint.py && bash tools/check.sh && bash tools/test.sh smoke issue pbf || { echo "::error::Tests nach dem Rebase rot"; exit 1; }
            fi
            if git push origin HEAD:main; then
              git push -f origin "HEAD:$BRANCH"   # the session sees: origin/<branch> is part of main
              echo "main = $(git rev-parse --short HEAD)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::main bewegt sich zu schnell"; exit 1
